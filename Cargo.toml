[package]
name = "rongorongo"
version = "0.1.0"
edition = "2021"
description = "Research workspace tooling for audit-ready Rongorongo corpus and decipherment notes"
license = "MIT"
repository = "https://github.com/malak333/Rongorongo"
# Transcription data is separately licensed (CC BY-NC 4.0) and is not part of the crate.
exclude = ["data/transcriptions/"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
